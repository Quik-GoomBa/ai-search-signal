<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 검색 출처 확인 · 스마트 검색 AI</title>
<style>
:root{
  --ink:#1d1d1f;--ink-soft:#3c3c3e;--muted:#6e6e73;
  --line:#e2e2e5;--bg:#f5f5f7;--card:#fff;
  --blue:#00968a;--blue-soft:#e6f6f4;--blue-mid:#bfe8e2;
  --trust:#059669;--trust-soft:#d1fae5;
  --hold:#d97706;--hold-soft:#fef3c7;
  --doubt:#dc2626;--doubt-soft:#fee2e2;
  --brand:#00968a;--brand-ink:#0b3d38;
  --header-bg:#0b3d38;
  --pink:#e5177b;--pink-soft:#fde8f2;
  --radius:18px;--radius-sm:12px;
  --sh:0 1px 3px rgba(0,0,0,.07);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Malgun Gothic','Apple SD Gothic Neo',-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;}
button,input,select,textarea{font-family:inherit;}
@keyframes stageIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
@keyframes sparklePop{0%,100%{transform:scale(1) rotate(0deg);}50%{transform:scale(1.15) rotate(8deg);}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px;}

/* ── 표지 ── */
.cover{min-height:100vh;background:var(--header-bg);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 18px;}
.cover-emoji{font-size:46px;margin-bottom:8px;animation:sparklePop 2.6s ease-in-out infinite;}
.cover-ttl{font-size:27px;font-weight:700;letter-spacing:-.5px;text-align:center;}
.cover-sub{font-size:14px;opacity:.82;margin-top:7px;text-align:center;line-height:1.6;max-width:420px;}
.home-row{display:flex;align-items:center;gap:10px;width:100%;max-width:560px;margin-top:26px;}
.home-search{flex:1;min-width:0;background:#fff;border-radius:28px;display:flex;align-items:center;padding:0 20px;height:54px;gap:10px;box-shadow:0 6px 24px rgba(0,0,0,.22);}
.home-search input{border:0;outline:0;font-size:16px;flex:1;background:transparent;color:#222;font-weight:700;}
.home-search input::placeholder{color:#b6b6bb;font-weight:400;}
.chip-hint{font-size:12px;color:rgba(255,255,255,.62);margin:22px 0 10px;}
.chip-row{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;width:100%;max-width:660px;}
.chip{background:rgba(255,255,255,.09);border:1.5px solid rgba(255,255,255,.2);border-radius:999px;color:rgba(255,255,255,.9);padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s;}
.chip:hover{background:rgba(255,255,255,.2);}
.chip.sel{background:#fff;color:var(--brand-ink);border-color:#fff;}
.search-btn{flex-shrink:0;height:54px;background:var(--brand);color:#fff;border:0;border-radius:28px;padding:0 26px;font-size:15px;font-weight:900;cursor:pointer;white-space:nowrap;box-shadow:0 6px 20px rgba(0,150,138,.35);transition:all .18s;}
.search-btn:disabled{background:rgba(255,255,255,.1);color:rgba(255,255,255,.34);cursor:not-allowed;box-shadow:none;}
.search-btn:not(:disabled):hover{filter:brightness(1.1);}
.search-btn:not(:disabled):active{transform:scale(.97);}
.cover-foot{margin-top:26px;font-size:12px;opacity:.55;text-align:center;line-height:1.7;}
.link-btn{background:none;border:0;color:rgba(255,255,255,.7);font-size:12px;text-decoration:underline;cursor:pointer;padding:6px;}
.link-btn:hover{color:#fff;}

/* ── 상단 진행 바 ── */
.stat-bar{position:sticky;top:0;z-index:101;background:var(--header-bg);padding:8px 16px;}
.stat-bar-inner{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:12px;}
.stat-label{font-size:11px;font-weight:800;color:rgba(255,255,255,.78);white-space:nowrap;}
.stat-track{flex:1;max-width:240px;height:7px;background:rgba(255,255,255,.14);border-radius:999px;overflow:hidden;}
.stat-fill{height:100%;border-radius:999px;background:var(--brand);transition:width .4s cubic-bezier(.34,1.56,.64,1);}
.stat-val{font-size:13px;font-weight:900;color:#fff;}
.stat-progress{font-size:11px;color:rgba(255,255,255,.55);margin-left:auto;white-space:nowrap;}

/* ── 검색 상단바 ── */
.topbar{background:var(--header-bg);position:sticky;top:39px;z-index:100;}
.topbar-inner{display:flex;align-items:center;gap:14px;padding:12px 16px;max-width:1080px;margin:0 auto;}
.brand-logo{font-size:16px;font-weight:700;color:#fff;white-space:nowrap;letter-spacing:-.4px;padding:6px 4px;}
.searchbox{flex:1;max-width:540px;background:#fff;border-radius:24px;display:flex;align-items:center;padding:0 15px;height:40px;gap:8px;box-shadow:0 4px 16px rgba(0,0,0,.16);}
.searchbox input{border:0;outline:0;font-size:14px;flex:1;background:transparent;color:#222;}
.nav-tabs{background:#fff;border-bottom:1px solid #e5e9e8;display:flex;align-items:center;padding:0 16px;overflow-x:auto;box-shadow:0 1px 0 rgba(0,150,138,.05);}
.nav-tab{padding:11px 15px;font-size:13px;color:#928da8;white-space:nowrap;border-bottom:2px solid transparent;font-weight:600;}
.nav-tab.active{color:var(--brand);font-weight:800;border-bottom-color:var(--brand);}

/* ── 레이아웃 ── */
.main-wrap{max-width:1080px;margin:0 auto;padding:20px 16px 60px;display:grid;grid-template-columns:1fr 290px;gap:22px;animation:stageIn .35s ease both;}
@media(max-width:860px){.main-wrap{grid-template-columns:1fr;}.sidebar{display:none;}}

/* ── AI 패널 ── */
.ai-panel{background:var(--card);border-radius:var(--radius);border:1.5px solid var(--blue-mid);box-shadow:var(--sh);overflow:hidden;}
.ai-hd{background:var(--header-bg);padding:13px 18px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.ai-badge{background:var(--pink);color:#fff;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;border:1px solid rgba(255,255,255,.35);display:inline-flex;align-items:center;gap:4px;}
.ai-badge svg{animation:sparklePop 2.4s ease-in-out infinite;}
.ai-hd-txt{color:#fff;font-size:13px;font-weight:700;}
.ai-body{padding:19px 21px;line-height:2;font-size:15px;color:var(--ink);}
.hl{display:inline;border-bottom:2px dashed #b8b8be;background:transparent;border-radius:3px;padding:2px 3px;cursor:pointer;transition:background .15s,border-color .15s;box-decoration-break:clone;-webkit-box-decoration-break:clone;}
.hl:hover{outline:1px solid var(--blue-mid);}
.hl.active{outline:2px solid var(--brand);outline-offset:2px;}
.hl.trust,.rpt-s.trust{background:var(--trust-soft);border-color:var(--trust);}
.hl.hold,.rpt-s.hold{background:var(--hold-soft);border-color:var(--hold);}
.hl.doubt,.rpt-s.doubt{background:var(--doubt-soft);border-color:var(--doubt);}
.hl-status{font-size:11px;font-weight:800;margin-left:4px;white-space:nowrap;}
.signal-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.signal-btn{flex:1;min-width:105px;border:2px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);padding:10px;font-weight:800;cursor:pointer;}
.signal-btn.trust[aria-pressed="true"]{background:var(--trust-soft);border-color:var(--trust);}
.signal-btn.hold[aria-pressed="true"]{background:var(--hold-soft);border-color:var(--hold);}
.signal-btn.doubt[aria-pressed="true"]{background:var(--doubt-soft);border-color:var(--doubt);}
.signal-btn:disabled{opacity:.45;cursor:not-allowed;}
.reason-input{display:block;width:100%;min-height:64px;margin-top:10px;padding:12px;border:1.5px solid var(--blue-mid);border-radius:var(--radius-sm);font-size:14px;line-height:1.8;resize:vertical;}
.src-tag{display:inline-block;font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px;margin-left:5px;cursor:pointer;vertical-align:middle;border:1.5px solid transparent;user-select:none;}
.src-tag:hover{filter:brightness(.93);}
.src-tag.read::before{content:'✔ ';}
.b-blog{background:#fef9c3;color:#854d0e;border-color:#fde68a;}
.b-news{background:#e0e4fb;color:#33299e;border-color:#c9cdf6;}
.b-gov{background:#dcfce7;color:#166534;border-color:#bbf7d0;}
.b-board{background:#f1f5f9;color:#475569;border-color:#e2e8f0;}

.src-badge-list{padding:15px 17px;background:var(--bg);border-top:1px solid var(--line);}
.src-badge-ttl{font-size:12px;font-weight:800;color:var(--muted);margin-bottom:10px;letter-spacing:.3px;}
.src-badge-row{display:flex;flex-wrap:wrap;gap:8px;}
.src-bdg{display:inline-block;font-size:12px;font-weight:800;padding:5px 13px;border-radius:999px;}

/* ── 출처 읽기 패널 ── */
.reader{display:none;margin:14px 0 4px;border:2px solid var(--blue-mid);border-radius:var(--radius);background:linear-gradient(135deg,var(--blue-soft),#fff);overflow:hidden;box-shadow:0 4px 16px rgba(0,150,138,.1);scroll-margin-top:150px;}
.reader.open{display:block;}
.reader-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 13px;background:var(--blue-soft);border-bottom:1px solid var(--blue-mid);}
.reader-hd-l{font-size:13px;font-weight:900;color:var(--brand);}
.reader-close{font-size:11px;color:var(--muted);cursor:pointer;padding:4px 9px;border-radius:999px;border:1px solid var(--line);background:#fff;flex-shrink:0;}
.reader-close:hover{border-color:var(--brand);color:var(--brand);}
.reader-body{padding:13px 15px;}
.reader-guide{font-size:12px;color:var(--muted);font-weight:700;line-height:1.6;margin-bottom:9px;}
.doc{background:#fff;border:1px solid var(--blue-mid);border-radius:11px;overflow:hidden;}
.doc-hd{padding:11px 13px;border-bottom:1px solid var(--line);}
.doc-ttl{font-size:15px;font-weight:800;color:var(--ink);line-height:1.45;margin-bottom:6px;}
.doc-meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);}
.doc-meta b{color:var(--ink-soft);font-weight:800;}
.doc-txt{padding:13px 15px;font-size:14px;line-height:1.95;color:var(--ink-soft);white-space:pre-wrap;max-height:38vh;overflow-y:auto;}
.reader-btn{margin-top:11px;width:100%;background:var(--brand);color:#fff;border:0;border-radius:999px;padding:12px;font-size:13px;font-weight:900;cursor:pointer;transition:transform .12s;}
.reader-btn:hover{filter:brightness(1.08);}
.reader-btn:active{transform:scale(.97);}
.reader-btn:disabled{background:var(--trust);cursor:default;filter:none;}

/* ── 사이드바 ── */
.sidebar{display:flex;flex-direction:column;gap:14px;}
.side-card{background:var(--card);border-radius:var(--radius);border:1px solid var(--line);box-shadow:var(--sh);overflow:hidden;}
.side-hd{padding:11px 15px;border-bottom:1px solid var(--line);font-size:13px;font-weight:800;color:var(--ink-soft);}
.side-item{padding:10px 13px;border-bottom:1px solid var(--line);cursor:pointer;}
.side-item:last-child{border-bottom:0;}
.side-item:hover{background:var(--blue-soft);}
.side-ttl{font-size:13px;font-weight:700;color:var(--ink);line-height:1.4;margin:4px 0 2px;}
.side-snip{font-size:11px;color:var(--muted);}
.side-note{padding:12px 14px;font-size:12px;color:var(--muted);line-height:1.7;}

/* ── 완료 ── */
.done-bar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--card);border-top:2px solid var(--blue-mid);box-shadow:0 -6px 28px rgba(0,150,138,.12);padding:12px 16px;}
.done-inner{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.done-txt{font-size:13px;font-weight:700;color:var(--muted);flex:1;}
.done-btn{background:var(--brand);color:#fff;border:0;border-radius:999px;padding:12px 26px;font-size:14px;font-weight:900;cursor:pointer;}
.done-btn:disabled{background:var(--line);color:var(--muted);cursor:not-allowed;}
.done-btn:not(:disabled):hover{filter:brightness(1.08);}
.done-inner .home-btn{flex:0 0 auto;min-width:0;padding:11px 18px;}
.main-wrap{padding-bottom:90px;}

/* ── 정리 화면 ── */
.wrap-pg{max-width:1180px;margin:0 auto;padding:14px 16px 20px;animation:stageIn .35s ease both;}
.rpt{background:var(--card);border-radius:var(--radius);border:2px solid var(--brand);overflow:hidden;}
.rpt-hd{background:var(--header-bg);padding:16px 19px;color:#fff;}
.rpt-hd h2{font-size:19px;font-weight:700;letter-spacing:-.4px;}
.rpt-hd p{font-size:12px;opacity:.82;margin-top:3px;}
.rpt-bd{padding:16px 19px;}
.rpt-q{background:var(--blue-soft);border:1.5px solid var(--blue-mid);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:14px;}
.rpt-q-l{font-size:11px;font-weight:800;color:var(--muted);margin-bottom:4px;}
.rpt-q-v{font-size:16px;font-weight:800;color:var(--brand-ink);}
.rpt-sec-ttl{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.4px;margin-bottom:8px;}
.rpt-s{border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 13px;margin-bottom:7px;font-size:13px;line-height:1.7;background:var(--bg);}
.rpt-s b{color:var(--brand);font-weight:900;}
.rpt-s .rs-src{display:block;font-size:11px;color:var(--muted);margin-top:4px;}
.next-box{background:linear-gradient(135deg,var(--blue-soft),var(--pink-soft));border:1.5px solid var(--blue-mid);border-radius:var(--radius);padding:15px 17px;margin-top:16px;}
.next-ttl{font-weight:900;font-size:14px;color:var(--brand);margin-bottom:6px;}
.next-txt{font-size:13px;line-height:1.85;color:var(--ink-soft);}
.btn-row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;}
.ghost-btn{flex:1;min-width:140px;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:11px;font-size:13px;font-weight:800;color:var(--ink-soft);cursor:pointer;}
.ghost-btn:hover{border-color:var(--brand);color:var(--brand);}

/* 결과 상단에 원래 AI 답변과 선택한 신호등 색 표시 */
.result-answer{margin-bottom:10px;}
.result-answer .ai-hd{padding:8px 12px;}
.result-answer .ai-body{padding:10px 13px;font-size:14px;line-height:2;}
.result-answer .hl{cursor:pointer;border-bottom-style:solid;}
.result-answer .hl:hover{outline:2px solid var(--brand);}
.result-answer .src-tag{cursor:default;}
.result-answer .src-tag:hover{filter:none;}
/* 결과는 문장 순서대로 2×2 배치 */
.result-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}
.result-card{margin:0;min-width:0;overflow-wrap:anywhere;display:flex;flex-direction:column;gap:6px;line-height:1.55;}
.result-card .result-sentence{margin:0;padding:8px 10px;line-height:1.55;}
.result-card .rs-src{margin-top:auto;padding-top:6px;border-top:1px solid var(--line);}
.wrap-pg .rpt-hd{padding:12px 16px;}
.wrap-pg .rpt-bd{padding:12px 16px;}
.wrap-pg .rpt-q{padding:8px 12px;margin-bottom:8px;}
.wrap-pg .result-counts{margin:0 0 8px;gap:6px;}
.reflection-box{margin-top:12px;padding:10px 13px;background:var(--blue-soft);border:1px solid var(--blue-mid);border-radius:var(--radius-sm);}
.reflection-box label{font-size:14px;font-weight:800;color:var(--brand-ink);}
.reflection-box .reason-input{min-height:76px;margin-top:6px;overflow:hidden;resize:none;}
.wrap-pg .btn-row{margin-top:10px;}
@media(max-width:600px) and (orientation:portrait){
  .result-grid{grid-template-columns:1fr;}
  .wrap-pg{padding:10px 10px 20px;}
}

/* ── 교사 모드 ── */

/* v2: 결과 화면 압축 (1366×650 한 화면) */
.wrap-pg{max-width:1340px;padding:8px 12px 10px;}
.wrap-pg .rpt-hd{display:flex;align-items:baseline;gap:16px;padding:8px 16px;}
.wrap-pg .rpt-hd h2{font-size:19px;}
.wrap-pg .rpt-hd .rpt-q-v{color:#fff;font-size:17px;}
.wrap-pg .rpt-bd{padding:8px 14px 10px;}
.result-answer .ai-body{padding:8px 14px;font-size:15px;line-height:2;}
.result-answer .num{display:inline-block;min-width:18px;height:18px;line-height:18px;text-align:center;border-radius:50%;background:var(--brand-ink);color:#fff;font-size:11px;margin-right:2px;}
.hl.none,.rpt-s.none{background:#f1f1f3;border-color:#c7c7cc;}
.wrap-pg .result-counts{margin:6px 0;}
.wrap-pg .result-counts .src-bdg{padding:3px 11px;font-size:12px;background:var(--bg);border:1px solid var(--line);}
.result-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;}
.wrap-pg .result-card{padding:10px 12px;margin:0;font-size:14px;gap:6px;}
.wrap-pg .result-card .result-sentence{padding:6px 9px;font-size:14px;}
.rc-reason p{white-space:pre-wrap;margin-top:2px;}
.wrap-pg .result-card .rs-src{font-size:11.5px;line-height:1.5;}
.wrap-pg .reflection-box{margin-top:8px;padding:6px 10px;display:flex;align-items:center;gap:10px;}
.wrap-pg .reflection-box label{font-size:13px;white-space:nowrap;}
.wrap-pg .reflection-box .reason-input{min-height:38px;margin-top:0;padding:7px 10px;font-size:13px;line-height:1.6;}
.wrap-pg .btn-row{margin-top:8px;align-items:center;gap:8px;}
.wrap-pg .ghost-btn{flex:0 0 auto;min-width:0;padding:8px 16px;font-size:12.5px;}
.wrap-pg .result-card{cursor:pointer;transition:border-color .15s;}
.wrap-pg .result-card:hover{border-color:var(--brand);}
.go-judge{color:var(--brand);font-weight:800;}
.bonus-btn{border-color:var(--hold)!important;color:#92400e!important;background:var(--hold-soft)!important;}
.cap-hint{margin-left:auto;font-size:11.5px;color:var(--muted);}
@media(max-width:900px){.result-grid{grid-template-columns:repeat(2,minmax(0,1fr));}.wrap-pg .reflection-box{display:block;}}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =======================================================================
   앱_스마트검색AI_v3
   v3.1: 검색 화면 왼쪽 아래 '검색 처음으로' 버튼 추가(기록은 그대로 유지)
   v3 변경로그: 7개 주제 검색 결과 데이터 전면 개편(원문 3문장 내외·블로그/질문답변/광고 가짜 정보 추가)·🟢 신뢰는 이유 입력 없이 완료
   (v2: 1문장 이상 결과 열림·자동 저장·결과 화면 한 화면 맞춤·한 걸음 더(만리장성)·이유 칸 축소)
   숲빛 Edu System 토큰 계승 / 내리숲초등학교 인공지능 윤리교육 연구학교
   ※ 기관명·요금·운영 정보는 수업용으로 재구성한 자료입니다.
   ======================================================================= */

const KIND = {
  gov:   {cls:'b-gov',   label:'공식 홈페이지'},
  news:  {cls:'b-news',  label:'뉴스'},
  intv:  {cls:'b-news',  label:'인터뷰'},
  blog:  {cls:'b-blog',  label:'블로그'},
  board: {cls:'b-board', label:'커뮤니티'},
  qna:   {cls:'b-board', label:'질문답변'}
};

const DATA = [
{ id:1, type:'err', q:'롯데월드 자유이용권 초등학생 할인',
  sents:[
    {t:'자유이용권으로 어드벤처와 매직아일랜드를 모두 이용할 수 있다.', src:'a'},
    {t:'자유이용권은 산 날에만 쓸 수 있다.', src:'b'},
    {t:'초등학생은 할인된 가격으로 자유이용권을 살 수 있다.', src:'c'},
    {t:'학생증을 보여 주면 현장에서도 반값으로 살 수 있다.', src:'d'}
  ],

       body:'T익스프레스는 에버랜드를 대표하는 나무 롤러코스터다. 최고 높이 56미터에서 급강하하는 구간이 가장 유명하다. 주말에는 대기 시간이 한 시간을 넘는 날도 많다.'},

    c:{title:'안전하게 이용하기', who:'에버랜드', date:'2026.03.01', kind:'gov',
       body:'모든 놀이기구에 음식물을 가지고 탈 수 없습니다. 임산부, 심장 질환이 있는 분, 목이나 허리가 불편한 분은 탑승을 삼가 주십시오. 날씨에 따라 운행이 잠시 멈출 수 있습니다.'}

];



const SIGNAL = {
  trust:{label:'신뢰', icon:'🟢'},
  hold:{label:'보류', icon:'🟡'},
  doubt:{label:'의심', icon:'🔴'}
};
const STORE_KEY = 'smartSearchAI_v3';
const blankRec = () => ({read:{}, judgments:{}, reasons:{}, reflection:''});
let state = {view:'home', qid:null, mainQid:null, records:{}, openIdx:null};
let clearArmed = false;

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cur = () => DATA.find(d => d.id === state.qid);
const rec = () => (state.records[state.qid] ||= blankRec());
const needsReason = j => j === 'hold' || j === 'doubt';
const isDone = (r,i) => !!(r.read[i] && SIGNAL[r.judgments[i]] && (!needsReason(r.judgments[i]) || (r.reasons[i] || '').trim()));
const judgedCount = () => cur().sents.filter((s,i) => isDone(rec(),i)).length;
const hasData = r => r && (Object.keys(r.read).length || r.reflection.trim());
const BONUS = () => DATA.find(d => d.bonus);

/* ── 자동 저장: 이 크롬북 브라우저 안에만 저장 ── */
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify({view:state.view, qid:state.qid, mainQid:state.mainQid, records:state.records})); }catch(e){}
}
function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return;
    const s = JSON.parse(raw);
    const ok = id => DATA.some(d => d.id === id);
    state.records = (s.records && typeof s.records === 'object') ? s.records : {};
    Object.keys(state.records).forEach(k => { state.records[k] = Object.assign(blankRec(), state.records[k]); });
    state.qid = ok(s.qid) ? s.qid : null;
    state.mainQid = ok(s.mainQid) ? s.mainQid : null;
    state.view = (state.qid && ['search','wrap'].includes(s.view)) ? s.view : 'home';
    if(state.view === 'wrap' && judgedCount() < 1) state.view = 'search';
  }catch(e){}
}
window.addEventListener('beforeunload', e => {
  if(state.view !== 'home' && hasData(state.records[state.qid])){ e.preventDefault(); e.returnValue = ''; }
});

function render(){
  const v = state.view;
  if(v === 'home') renderHome();
  else if(v === 'search') renderSearch();
  else if(v === 'wrap') renderWrap();
  save();
}

/* ── 표지 ── */
function renderHome(){
  const sel = DATA.find(d => d.id === state.qid && !d.bonus);
  $('#app').innerHTML = `
  <div class="cover">
    <div class="cover-emoji">&#128269;</div>
    <div class="cover-ttl">스마트 검색 AI</div>
    <div class="cover-sub">궁금한 것을 검색하면 AI가 여러 글을 모아 답을 만들어 줍니다.</div>
    <div class="home-row">
      <div class="home-search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#00968a" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.2" y2="16.2"></line></svg>
        <input value="${sel ? esc(sel.q) : ''}" placeholder="검색어를 골라 주세요" readonly aria-label="검색어">
      </div>
      <button class="search-btn" ${sel ? '' : 'disabled'} onclick="startSearch()">AI 검색</button>
    </div>
    <div class="chip-hint">이런 것들을 많이 검색했어요</div>
    <div class="chip-row">
      ${DATA.filter(d => !d.bonus && !d.hidden).map(d => `<button class="chip${sel && sel.id===d.id?' sel':''}" onclick="pickQ(${d.id})">${hasData(state.records[d.id]) ? '✔ ' : ''}${esc(d.q)}</button>`).join('')}
    </div>
    <div class="cover-foot">내리숲초등학교 인공지능 윤리교육 연구학교<br>수업을 위해 다시 꾸민 자료예요.<br>
      <button class="link-btn" onclick="clearAll()">${clearArmed ? '한 번 더 누르면 이 크롬북의 기록이 모두 지워져요' : '기록 모두 지우기'}</button>
    </div>
  </div>`;
}
function pickQ(id){ state.qid = id; clearArmed = false; render(); }
function clearAll(){
  if(!clearArmed){ clearArmed = true; renderHome(); setTimeout(() => { if(clearArmed){ clearArmed = false; if(state.view==='home') renderHome(); } }, 4000); return; }
  clearArmed = false;
  state = {view:'home', qid:null, mainQid:null, records:{}, openIdx:null};
  try{ localStorage.removeItem(STORE_KEY); }catch(e){}
  render();
}
function startSearch(id){
  if(id !== undefined) state.qid = id;
  if(!cur()) return;
  if(!cur().bonus) state.mainQid = state.qid;
  rec();
  state.openIdx = null;
  go('search');
}
function go(v){
  if(v === 'wrap' && judgedCount() < 1) return;
  state.view = v; render(); window.scrollTo(0,0);
}

/* ── 검색 화면 ── */
function renderSearch(){
  const d = cur(), r = rec();
  const n = judgedCount();
  const total = d.sents.length;
  const pct = Math.round(n/total*100);
  const kinds = [...new Set(d.sents.map(s => d.srcs[s.src].kind))];

  $('#app').innerHTML = `
  <div class="stat-bar"><div class="stat-bar-inner">

    </div>
  </div></header>

  </nav>

  <div class="main-wrap">
    <div>
      <div class="ai-panel">
        <div class="ai-hd">
          <span class="ai-badge"><svg width="11" height="11" viewBox="0 0 24 24" fill="#fff"><path d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8z"></path></svg>AI 답변</span>
          <span class="ai-hd-txt">스마트 검색 AI가 검색 결과를 바탕으로 요약한 내용이에요</span>
        </div>
        <div class="ai-body"><p>
          ${d.sents.map((s,i) => {
            const k = KIND[d.srcs[s.src].kind];
            const judgment = r.judgments[i];
            const done = judgment ? ' ' + judgment : '';
            const act = state.openIdx === i ? ' active' : '';
            const rd = r.read[i] ? ' read' : '';
            return `<span class="hl${done}${act}" onclick="openSrc(${i})">${esc(s.t)}${judgment ? `<span class="hl-status">${SIGNAL[judgment].icon} ${SIGNAL[judgment].label}</span>` : ''}<button class="src-tag ${k.cls}${rd}" onclick="event.stopPropagation();openSrc(${i})">${k.label}↗</button></span> `;
          }).join('')}
        </p></div>

        <div class="reader${state.openIdx !== null ? ' open' : ''}" id="reader">${state.openIdx !== null ? readerHTML(d, state.openIdx) : ''}</div>

        <div class="src-badge-list">
          <div class="src-badge-ttl">🔗 검색 결과 출처</div>
          <div class="src-badge-row">${kinds.map(k => `<span class="src-bdg ${KIND[k].cls}">${KIND[k].label}</span>`).join('')}</div>
        </div>
      </div>
    </div>

    <aside class="sidebar">
      <div class="side-card">
        <div class="side-hd">이 검색에 쓰인 글</div>
        ${Object.keys(d.srcs).map(key => {
          const s = d.srcs[key];
          const idx = d.sents.findIndex(x => x.src === key);
          return `<div class="side-item" onclick="openSrc(${idx})">
            <span class="src-bdg ${KIND[s.kind].cls}" style="font-size:10px;padding:2px 8px;">${KIND[s.kind].label}</span>
            <div class="side-ttl">${esc(s.title)}</div>
            <div class="side-snip">${esc(s.who)} · ${esc(s.date)}</div>
          </div>`;
        }).join('')}
      </div>
      <div class="side-card">
        <div class="side-hd">확인하는 방법</div>
        <div class="side-note">문장을 누르면 그 문장이 어느 글에서 왔는지 열립니다. 출처를 읽고 신호등 색을 고르세요. 🟡 보류나 🔴 의심을 골랐다면 판단 이유를 적어요.<br>🟢 신뢰 · 🟡 보류 · 🔴 의심<br><br>글의 종류만 보고 믿거나 의심하지 마세요. 공식 홈페이지에서 온 문장도 내용이 달라져 있을 수 있고, 블로그에서 온 문장이 맞을 수도 있습니다. 판단은 글 안을 읽은 뒤에 하세요.</div>
      </div>
    </aside>
  </div>

  <div class="done-bar"><div class="done-inner">
    <button class="ghost-btn home-btn" onclick="goHome()">🏠 검색 처음으로</button>

    ${d.bonus && state.mainQid ? `<button class="ghost-btn" style="flex:0 0 auto;" onclick="backToMain()">우리 검색어 결과로</button>` : ''}
    <button class="done-btn" id="show-results" ${n < 1 ? 'disabled' : ''} onclick="go('wrap')">확인 결과 모아보기</button>
  </div></div>`;

  if(state.openIdx !== null) setTimeout(() => $('#reader')?.scrollIntoView({behavior:'smooth', block:'center'}), 60);

function readerHTML(d, i){
  const r = rec();
  const s = d.srcs[d.sents[i].src];
  const k = KIND[s.kind];
  const done = !!r.read[i];
  return `
  <div class="reader-hd">
    <span class="reader-hd-l">${i+1}번 문장이 가져온 글</span>
    <button class="reader-close" onclick="closeSrc()">닫기 ✕</button>
  </div>
  <div class="reader-body">
    <div class="reader-guide"><b>판단할 문장: ${esc(d.sents[i].t)}</b><br>글의 종류만 보고 판단하지 마세요. 글 안에 문장과 같은 내용이 정말 있는지 끝까지 읽어 보세요.</div>

      <div class="doc-hd">
        <div class="doc-ttl">${esc(s.title)}</div>
        <div class="doc-meta">
          <span><b>${esc(s.who)}</b></span>
          <span>작성일 ${esc(s.date)}</span>
          <span class="src-bdg ${k.cls}" style="font-size:10px;padding:2px 8px;">${k.label}</span>
        </div>
      </div>
      <div class="doc-txt">${esc(s.body)}</div>
    </div>
    <button class="reader-btn" ${done ? 'disabled' : ''} onclick="markRead(${i})">
      ${done ? '✔ 출처를 읽었어요' : '이 글을 끝까지 읽었어요'}
    </button>
    <div class="reader-guide" style="margin-top:12px;" id="signal-guide">${done ? '원문과 비교해 신호등을 골라 주세요. 판단은 다시 바꿀 수 있어요.' : '출처를 읽었다고 표시하면 신호등을 고를 수 있어요.'}<br>🟢 신뢰: 근거가 충분해요 · 🟡 보류: 더 확인해야 해요 · 🔴 의심: 틀렸거나 근거가 부족해요</div>
    <div class="signal-row" role="group" aria-label="${i+1}번 문장 신호등 판정" aria-describedby="signal-guide">
      ${Object.entries(SIGNAL).map(([key,value]) => `<button class="signal-btn ${key}" aria-pressed="${r.judgments[i] === key}" ${done ? '' : 'disabled'} onclick="judge(${i},'${key}')">${value.icon} ${value.label}</button>`).join('')}
    </div>
    ${r.judgments[i] === 'trust' ? `<div class="next-box">
      <div class="next-ttl">${i+1}번 문장을 🟢 신뢰로 골랐어요</div>
      <div class="next-txt">원문에 같은 내용이 있는지 확인했다면 정리를 마쳐요.</div>
      <button class="reader-btn" id="finish-sentence" onclick="finishSentence(${i})">이 문장 정리 완료</button>
    </div>` : r.judgments[i] ? `<div class="next-box">
      <div class="next-ttl"><label for="sentence-reason">${i+1}번 문장을 ${SIGNAL[r.judgments[i]].icon} ${SIGNAL[r.judgments[i]].label}로 판단한 이유</label></div>
      <div class="next-txt" id="reason-guide">원문에서 찾은 근거를 짧게 적어요.</div>
      <textarea id="sentence-reason" class="reason-input" aria-describedby="reason-guide reason-note" placeholder="원문에는 …라고 나와 있어요." oninput="updateReason(${i},this.value)">${esc(r.reasons[i] || '')}</textarea>
      <div class="next-txt" id="reason-note" style="font-size:12px;margin-top:6px;">입력한 내용은 이 크롬북에 자동으로 저장돼요.</div>
      <button class="reader-btn" id="finish-sentence" ${(r.reasons[i] || '').trim() ? '' : 'disabled'} onclick="finishSentence(${i})">이 문장 정리 완료</button>
    </div>` : ''}
  </div>`;
}

function completionMessage(n,total){
  if(n === 0) return '한 문장 이상 정리하면 결과를 볼 수 있어요.';
  if(n < total) return `${n}개 문장을 정리했어요. 결과를 볼 수 있어요. (남은 문장 ${total-n}개)`;
  return '모든 문장을 정리했어요.';
}
function updateReason(i,value){
  rec().reasons[i] = value;
  const n = judgedCount(), total = cur().sents.length;
  $('#completed-count').textContent = `${n}/${total}`;
  $('#completed-fill').style.width = `${Math.round(n/total*100)}%`;
  $('#completion-message').textContent = completionMessage(n,total);
  $('#show-results').disabled = n < 1;
  if($('#finish-sentence')) $('#finish-sentence').disabled = !value.trim();
  save();
}
function finishSentence(i){
  if(!isDone(rec(),i)) return;
  closeSrc();
}

function openSrc(i){ state.openIdx = (state.openIdx === i ? null : i); render(); }
function closeSrc(){ state.openIdx = null; render(); }
function markRead(i){ rec().read[i] = true; render(); }
function judge(i, value){
  if(!cur().sents[i] || !rec().read[i] || !Object.prototype.hasOwnProperty.call(SIGNAL,value)) return;
  rec().judgments[i] = value;
  state.openIdx = i;
  render();
}
function goHome(){ state.openIdx = null; go('home'); }
function backToMain(){
  state.qid = state.mainQid; state.openIdx = null;
  go(judgedCount() >= 1 ? 'wrap' : 'search');
}

/* ── 정리 화면: 크롬북 가로 한 화면(약 1366×650)에 들어가도록 ── */

  const cls = i => isDone(r,i) ? r.judgments[i] : 'none';
  const pending = d.sents.filter((s,i) => !isDone(r,i)).length;
  const bonus = BONUS();
  $('#app').innerHTML = `
  <div class="wrap-pg">

      <div class="rpt-hd">
        <h2>${d.bonus ? '⭐ 한 걸음 더 · ' : ''}신호등 확인 결과</h2>

      </div>

        </section>
        <div class="signal-row result-counts" aria-label="판정별 문장 수">
          ${Object.entries(SIGNAL).map(([key,value]) => `<span class="src-bdg">${value.icon} ${value.label} ${d.sents.filter((s,i) => isDone(r,i) && r.judgments[i] === key).length}개</span>`).join('')}
          ${pending ? `<span class="src-bdg">⚪ 판정 전 ${pending}개</span>` : ''}
        </div>
        <div class="result-grid">
        ${d.sents.map((s,i) => {
          const src = d.srcs[s.src];
          return `<div class="rpt-s result-card" role="button" tabindex="0" title="눌러서 이 문장 판정하러 가기" onclick="editSentence(${i})">
            <div class="rpt-s result-sentence ${cls(i)}"><b>${i+1}번 문장</b> · <strong>${sig(i).icon} ${sig(i).label}</strong></div>
            <div class="rc-reason"><b>판단 이유</b><p>${!isDone(r,i) ? '<span class="go-judge">눌러서 판정하러 가요 →</span>' : r.judgments[i] === 'trust' ? '원문과 같은 내용을 확인했어요.' : esc(r.reasons[i])}</p></div>
            <span class="rs-src"><strong>확인한 출처</strong> ${esc(src.title)} · ${esc(src.who)} · ${esc(src.date)} · ${KIND[src.kind].label}</span>
          </div>`;
        }).join('')}
        </div>
        <div class="reflection-box">
          <label for="reflection">신호등 확인 후 알게 된 점이나 느낀 점</label>
          <textarea id="reflection" class="reason-input" rows="1" placeholder="AI 답변과 출처를 비교하면서 알게 된 점이나 느낀 점을 적어 보세요." oninput="rec().reflection = this.value;fitReflection(this);save()">${esc(r.reflection)}</textarea>
        </div>
        <div class="btn-row">
          <button class="ghost-btn" onclick="go('search')">검색 화면으로 돌아가기</button>
          <button class="ghost-btn" onclick="go('home')">검색 처음으로</button>
          ${d.bonus
            ? (state.mainQid ? `<button class="ghost-btn" onclick="backToMain()">우리 검색어 결과로</button>` : '')
            : (bonus ? `<button class="ghost-btn bonus-btn" onclick="startSearch(${bonus.id})">⭐ 한 걸음 더</button>` : '')}
          <span class="cap-hint">화면 캡처해서 올리기</span>
        </div>
      </div>
    </div>
  </div>`;
  fitReflection($('#reflection'));
}

function editSentence(i){ state.openIdx = i; go('search'); }

function fitReflection(el){
  if(!el) return;
  el.style.height = 'auto';
  el.style.height = Math.max(38,el.scrollHeight + 3) + 'px';
}

document.addEventListener('keydown', e => { if(e.key === 'Enter' && e.target.matches('[role=button][onclick]')) e.target.click(); });
load();

render();
</script>
</body>
</html>
